<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street names</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#d8d8d8; --accent:#1565c0; --bad:#d50000; --good:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px system-ui, sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  .tab { font:inherit; padding:8px 16px; border:2px solid var(--accent); background:#fff; color:var(--accent); border-radius:8px; cursor:pointer; font-weight:600; }
  .tab.on { background:var(--accent); color:#fff; }
  #state { margin-left:auto; color:var(--muted); font-size:14px; }
  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; }
  aside { width:330px; border-left:1px solid var(--line); overflow:auto; padding:12px; }
  aside h2 { font-size:17px; margin:0 0 6px; }
  .big { font-size:30px; font-weight:700; }
  .muted { color:var(--muted); font-size:14px; }
  .item { display:block; width:100%; text-align:left; font:inherit; padding:9px 10px; margin:5px 0; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
  .item:hover { border-color:var(--accent); }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px; vertical-align:-1px; }
  input[type=text] { font:inherit; padding:9px; width:100%; border:2px solid var(--line); border-radius:8px; }
  button.go { font:inherit; font-weight:600; padding:9px 14px; background:var(--accent); color:#fff; border:0; border-radius:8px; cursor:pointer; margin-top:6px; }
  a.dl { display:inline-block; margin:6px 8px 0 0; color:var(--accent); }
  @media (max-width:760px) { main { flex-direction:column; } aside { width:auto; height:42%; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Street names &mdash; Fotouni</h1>
  <button class="tab on" data-tab="names">Street names</button>
  <button class="tab" data-tab="addresses">Addresses</button>
  <span id="state"></span>
</header>
<main><div id="map"></div><aside id="side"></aside></main>
<script>
  const P = location.pathname.endsWith('/') ? '../' : '';                  // the page is /simple or /simple/ : the api and static files are one level up
  const load = (src) => new Promise((ok) => { const s = document.createElement('script'); s.src = P + src; s.onload = ok; document.head.appendChild(s); });
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = P + 'static/vendor/leaflet.css'; document.head.appendChild(css);
  load('static/vendor/leaflet.js').then(() => load('static/simple.js'));
</script>
</body>
</html>
