[project]
name = "osmaddresssystem"
version = "0.1.0"
description = "OSM address/street network download and processing tools"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "shapely",
    "requests",
    "osmnx",
    "osm2geojson",
    "pandas",
    "rapidfuzz",
    "geopy",
    "folium>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osmaddresssystem"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "playwright>=1.61.0",
]
notebook = [
    "ipykernel>=7.3.0",
    "ipyleaflet>=0.20.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
]
